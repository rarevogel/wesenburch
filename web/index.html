<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2418">
<title>Wesenbuch</title>
<style>
/*@FONTS*/
:root {
  --paper: #f3ead6; --paper2: #eadfc4; --card: #f7f0df; --ink: #2b2118; --ink2: #554435; --muted: #85715b;
  --accent: #7a1f1a; --leather: #3a2418; --leather2: #4b2f20; --gilt: #d9b878; --line: #cdbb98; --shadow: rgba(58,36,24,.18);
  --serif: 'EB Garamond', Georgia, serif; --display: 'IM Fell English', 'EB Garamond', Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1d1612; --paper2: #251c16; --card: #2a2019; --ink: #ecdfc6; --ink2: #cbb99b; --muted: #9c8a71;
  --accent: #e08a62; --leather: #120c08; --leather2: #1f150f; --gilt: #d9b878; --line: #4a3b2d; --shadow: rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #1d1612; --paper2: #251c16; --card: #2a2019; --ink: #ecdfc6; --ink2: #cbb99b; --muted: #9c8a71;
  --accent: #e08a62; --leather: #120c08; --leather2: #1f150f; --gilt: #d9b878; --line: #4a3b2d; --shadow: rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 18px/1.5 var(--serif); font-variant-numeric: lining-nums; -webkit-tap-highlight-color: transparent; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }

header { background: linear-gradient(180deg, var(--leather2), var(--leather)); color: #f1e4c8; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 0; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 10px var(--shadow); }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }
.brand h1 { font: 400 30px/1.1 var(--display); margin: 0; color: var(--gilt); letter-spacing: .02em; }
.brand p { margin: 0; font-style: italic; color: #cdb995; font-size: 16px; }
nav { display: flex; gap: 4px; max-width: 1200px; margin: 6px auto 0; overflow-x: auto; scrollbar-width: none; }
nav button { background: none; border: 0; color: #cdb995; padding: 8px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font-family: var(--display); font-size: 18px; white-space: nowrap; }
nav button[aria-selected="true"] { background: var(--paper); color: var(--ink); }
nav .sp { flex: 1; }
#themeBtn { font-family: var(--serif); font-size: 15px; }

main { max-width: 1200px; margin: 0 auto; padding: 14px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.controls input[type=search] { flex: 1 1 220px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.controls select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); max-width: 100%; }
.controls label { display: flex; align-items: center; gap: 6px; font-size: 16px; color: var(--ink2); }
.count { color: var(--muted); font-style: italic; font-size: 16px; margin: 0 0 10px; }
input:focus-visible, select:focus-visible, button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 8px 10px; cursor: pointer; text-align: left; box-shadow: 0 1px 3px var(--shadow); position: relative; content-visibility: auto; contain-intrinsic-size: 150px 230px; transition: transform .12s; }
.card:hover { transform: translateY(-2px); }
.card .sk { aspect-ratio: 1; display: block; width: 100%; }
.card h3 { font: 400 19px/1.15 var(--display); margin: 6px 0 2px; overflow-wrap: anywhere; }
.card .meta { font-size: 14px; color: var(--muted); }
.card .marks { position: absolute; top: 6px; right: 8px; font-size: 15px; color: var(--accent); }
.tag { display: inline-block; font-size: 13px; padding: 0 7px; border: 1px solid var(--line); border-radius: 99px; color: var(--ink2); margin-right: 4px; white-space: nowrap; }
.tag.red { border-color: var(--accent); color: var(--accent); }

svg.sk { color: var(--ink); }

/* the detail page */
#detail { position: fixed; inset: 0; z-index: 30; background: var(--paper); overflow-y: auto; overscroll-behavior: contain; }
#detail[hidden] { display: none; }
.dbar { position: sticky; top: 0; display: flex; gap: 6px; align-items: center; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; background: var(--paper); border-bottom: 1px solid var(--line); z-index: 2; }
.dbar .sp { flex: 1; }
.btn { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; min-height: 40px; }
.btn.on { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.page { max-width: 1050px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .page { grid-template-columns: 420px minmax(0, 1fr); align-items: start; } .plate { position: sticky; top: 76px; } }
.plate { background: var(--card); border: 1px solid var(--line); padding: 14px; box-shadow: 0 2px 8px var(--shadow); }
.plate .sk { width: 100%; aspect-ratio: 1; display: block; }
.plate figcaption { font-style: italic; color: var(--ink2); font-size: 15px; text-align: center; margin-top: 8px; line-height: 1.35; }
.page h2 { font: 400 44px/1.05 var(--display); margin: 0; overflow-wrap: anywhere; }
.page .mean { font-style: italic; color: var(--ink2); margin: 4px 0 10px; }
.page h4 { font: 400 21px var(--display); margin: 18px 0 4px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.page p { margin: .3em 0; }
.appear { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; }
.appear dt { color: var(--muted); }
.appear dd { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 2px 12px; cursor: pointer; font-size: 16px; }
.chip:hover { border-color: var(--accent); }
.dropcap::first-letter { font: 400 3.1em/0.8 var(--display); float: left; margin: 6px 6px 0 0; color: var(--accent); }

/* episodes */
.seasons { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.ep { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 2px 12px; padding: 8px 0; border-bottom: 1px dotted var(--line); }
.ep .no { font-family: var(--display); color: var(--accent); font-size: 20px; }
.ep .t { font-weight: 600; }
.ep .dt { color: var(--muted); font-size: 15px; }
.ep.none .t { font-weight: 400; color: var(--ink2); }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; max-width: 520px; margin: 0 0 16px; font-size: 16px; }
.bars .b { height: 12px; background: var(--accent); border-radius: 0 3px 3px 0; opacity: .8; }
.bars .n { color: var(--ink2); }

.about { color: var(--ink2); font-size: 15px; margin-top: 30px; border-top: 1px solid var(--line); padding-top: 10px; }
.progress { height: 10px; background: var(--paper2); border-radius: 99px; overflow: hidden; max-width: 520px; border: 1px solid var(--line); }
.progress div { height: 100%; background: var(--accent); }
.empty { color: var(--muted); font-style: italic; }
.dim { color: var(--muted); }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .page h2 { font-size: 36px; } .brand h1 { font-size: 26px; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" class="sk">/*@DEFS*/</svg>
<header>
  <div class="brand"><h1>Wesenbuch</h1><p>a field guide to the creatures of Grimm</p></div>
  <nav role="tablist">
    <button role="tab" data-tab="book" aria-selected="true">Bestiary</button>
    <button role="tab" data-tab="eps" aria-selected="false">Episodes</button>
    <button role="tab" data-tab="mine" aria-selected="false">My book</button>
    <span class="sp"></span>
    <button id="themeBtn" aria-label="Switch between light and dark pages">Dark</button>
  </nav>
</header>
<main id="main"></main>
<div id="detail" hidden role="dialog" aria-modal="true"></div>
<script type="module">
/*@SCRIPT*/
</script>
</body>
</html>
